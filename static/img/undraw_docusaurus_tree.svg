<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <title>Universal Compatibility</title>
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8e6c9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad2)" rx="10"/>

  <!-- Center hub -->
  <circle cx="200" cy="150" r="35" fill="#1976d2"/>
  <text x="200" y="145" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">postal</text>
  <text x="200" y="158" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">-mime</text>

  <!-- Browser icon -->
  <circle cx="90" cy="80" r="30" fill="#fff" stroke="#1976d2" stroke-width="2"/>
  <rect x="72" y="65" width="36" height="25" rx="3" fill="#42a5f5"/>
  <rect x="75" y="68" width="30" height="16" fill="#e3f2fd"/>
  <text x="90" y="105" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Browser</text>

  <!-- Node.js icon -->
  <circle cx="310" cy="80" r="30" fill="#fff" stroke="#4caf50" stroke-width="2"/>
  <text x="310" y="75" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4caf50" font-weight="bold">Node</text>
  <text x="310" y="87" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4caf50">.js</text>
  <text x="310" y="105" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Node.js</text>

  <!-- Web Worker icon -->
  <circle cx="90" cy="220" r="30" fill="#fff" stroke="#ff9800" stroke-width="2"/>
  <rect x="75" y="208" width="30" height="20" rx="2" fill="#ff9800"/>
  <circle cx="82" cy="218" r="3" fill="#fff"/>
  <circle cx="98" cy="218" r="3" fill="#fff"/>
  <text x="90" y="245" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Web Worker</text>

  <!-- Cloudflare icon -->
  <circle cx="310" cy="220" r="30" fill="#fff" stroke="#f48120" stroke-width="2"/>
  <path d="M295 218 Q310 200, 325 218 Q320 228, 310 228 Q300 228, 295 218" fill="#f48120"/>
  <text x="310" y="245" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#333">Cloudflare</text>

  <!-- Connection lines -->
  <line x1="120" y1="95" x2="165" y2="130" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="280" y1="95" x2="235" y2="130" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="120" y1="205" x2="165" y2="170" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="280" y1="205" x2="235" y2="170" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,3"/>
</svg>
