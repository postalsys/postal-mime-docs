<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <title>TypeScript Ready</title>
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e1f5fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3e5fc;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad3)" rx="10"/>

  <!-- TypeScript logo area -->
  <rect x="150" y="60" width="100" height="100" fill="#3178c6" rx="10"/>
  <text x="200" y="125" text-anchor="middle" font-family="sans-serif" font-size="48" fill="#fff" font-weight="bold">TS</text>

  <!-- Type definitions representation -->
  <rect x="80" y="180" width="240" height="80" fill="#fff" rx="5" stroke="#3178c6" stroke-width="2"/>

  <!-- Code lines -->
  <rect x="95" y="195" width="80" height="8" fill="#3178c6" rx="2"/>
  <rect x="180" y="195" width="40" height="8" fill="#42a5f5" rx="2"/>
  <rect x="95" y="210" width="60" height="8" fill="#64b5f6" rx="2"/>
  <rect x="160" y="210" width="90" height="8" fill="#3178c6" rx="2"/>
  <rect x="95" y="225" width="100" height="8" fill="#42a5f5" rx="2"/>
  <rect x="200" y="225" width="50" height="8" fill="#64b5f6" rx="2"/>
  <rect x="95" y="240" width="70" height="8" fill="#3178c6" rx="2"/>

  <!-- Check mark badges -->
  <circle cx="290" cy="90" r="18" fill="#4caf50"/>
  <path d="M282 90 L288 96 L300 84" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Feature labels -->
  <text x="200" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">Full type definitions included</text>
</svg>
