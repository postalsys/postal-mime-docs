<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="envelopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42a5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976d2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64b5f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196f3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Envelope body -->
  <rect x="6" y="20" width="52" height="36" rx="3" ry="3" fill="url(#envelopeGrad)"/>

  <!-- Envelope flap (open) -->
  <path d="M6 23 L32 2 L58 23" fill="url(#flapGrad)" stroke="none"/>

  <!-- Inner fold lines -->
  <path d="M6 20 L32 38 L58 20" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>

  <!-- Code brackets representing parsing -->
  <text x="22" y="46" font-family="monospace" font-size="14" font-weight="bold" fill="#fff">{ }</text>

  <!-- Small binary/data indicator -->
  <circle cx="50" cy="12" r="4" fill="#4caf50"/>
  <path d="M48 12 L50 14 L54 10" stroke="#fff" stroke-width="1.5" fill="none"/>
</svg>
